<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Accounts">
  <title>Personal Accounts</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body x-data x-init="$store.app.init()">

  <!-- Fatal error overlay -->
  <div id="fatal-error" style="display:none" class="fatal-overlay">
    <p>App failed to load.</p>
    <button onclick="location.reload()">Reload</button>
  </div>

  <!-- Loading spinner -->
  <div x-show="$store.app.loading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Nav bar -->
  <header class="nav-bar">
    <button x-show="!$store.app.isPrimaryView()"
            @click="$store.app.goBack()"
            class="btn-icon">←</button>
    <span x-text="$store.app.viewTitle()"></span>
    <span x-show="!$store.app.isPrimaryView()" class="nav-spacer" aria-hidden="true"></span>
  </header>

  <!-- Home View -->
  <main x-show="$store.app.currentView === 'home'">
    <div class="month-nav">
      <button @click="$store.app.moveHomeMonth(-1)" class="btn-icon" aria-label="Previous month">‹</button>
      <span x-text="$store.app.home.month"></span>
      <button @click="$store.app.moveHomeMonth(1)" class="btn-icon" aria-label="Next month">›</button>
    </div>
    <section class="summary-grid" aria-label="Monthly summary">
      <article class="summary-card income-card">
        <span>收入</span>
        <strong x-text="$store.app.home.summary.income.toLocaleString()"></strong>
      </article>
      <article class="summary-card expense-card">
        <span>支出</span>
        <strong x-text="$store.app.home.summary.expense.toLocaleString()"></strong>
      </article>
      <article class="summary-card balance-card">
        <span>結餘</span>
        <strong x-text="$store.app.home.summary.balance.toLocaleString()"></strong>
      </article>
    </section>
    <h2 class="section-heading">最近交易</h2>
    <ul class="tx-list">
      <template x-if="$store.app.home.recent.length === 0">
        <li class="empty-state">本月尚無交易</li>
      </template>
      <template x-for="tx in $store.app.home.recent" :key="tx.Id">
        <li class="tx-row" @click="$store.app.openEdit(tx)">
          <span class="tx-icon" x-text="$store.app.iconDisplay(tx.CategoryIcon)"></span>
          <div class="tx-info">
            <span class="tx-category" x-text="tx.CategoryName || '未分類'"></span>
            <span class="tx-note" x-text="tx.Note"></span>
          </div>
          <div class="tx-right">
            <span class="tx-amount" :class="tx.Type === 'income' ? 'income' : 'expense'"
                  x-text="(tx.Type === 'income' ? '+' : '-') + Number(tx.Amount).toLocaleString() + ' ' + tx.Currency"></span>
            <span class="tx-date" x-text="tx.Date"></span>
          </div>
        </li>
      </template>
    </ul>
  </main>

  <!-- Statistics -->
  <main x-show="$store.app.currentView === 'statistics'">
    <div class="month-nav">
      <button @click="$store.app.moveStatisticsMonth(-1)" class="btn-icon" aria-label="Previous statistics month">‹</button>
      <span x-text="$store.app.statisticsState.anchorMonth"></span>
      <button @click="$store.app.moveStatisticsMonth(1)" class="btn-icon" aria-label="Next statistics month">›</button>
    </div>
    <section class="insight-grid">
      <article><small>收入月變化</small><strong x-text="$store.app.statisticsState.insights.incomeMoM"></strong></article>
      <article><small>支出月變化</small><strong x-text="$store.app.statisticsState.insights.expenseMoM"></strong></article>
      <article><small>最高支出</small><strong x-text="$store.app.statisticsState.insights.maxExpense"></strong></article>
      <article><small>最低淨額</small><strong x-text="$store.app.statisticsState.insights.minNet"></strong></article>
    </section>
    <h2 class="section-heading">近 12 個月收支</h2>
    <div class="chart-container statistics-chart"
         x-show="$store.app.statisticsState.monthly.some(row => row.income || row.expense)">
      <canvas id="statistics-monthly-chart"></canvas>
    </div>
    <div class="feature-empty compact"
         x-show="!$store.app.statisticsState.monthly.some(row => row.income || row.expense)">此期間尚無收支資料</div>
    <div class="section-toolbar">
      <h2 class="section-heading">支出分類趨勢</h2>
      <select aria-label="Expense category trend" x-model="$store.app.statisticsState.selectedCategoryId"
              @change="$store.app.setStatisticsCategory($event.target.value)">
        <option value="">前五大分類</option>
        <template x-for="category in $store.app.statisticsState.expenseCategories" :key="category.Id">
          <option :value="category.Id" x-text="category.Name"></option>
        </template>
      </select>
    </div>
    <div class="chart-container statistics-chart" x-show="$store.app.statisticsState.categorySeries.length">
      <canvas id="statistics-category-chart"></canvas>
    </div>
    <div class="feature-empty compact" x-show="!$store.app.statisticsState.categorySeries.length">此期間尚無分類支出</div>
  </main>

  <!-- Expense Category Report -->
  <main x-show="$store.app.currentView === 'categoryReport'">
    <div class="range-tabs">
      <template x-for="option in [{id:'week',label:'週'},{id:'month',label:'月'},{id:'year',label:'年'},{id:'all',label:'全部'}]" :key="option.id">
        <button @click="$store.app.setReportRange(option.id)" :class="{ active: $store.app.report.range === option.id }" x-text="option.label"></button>
      </template>
    </div>
    <div class="month-nav report-period">
      <button @click="$store.app.moveReportPeriod(-1)" class="btn-icon" :disabled="$store.app.report.range === 'all'">‹</button>
      <span x-text="$store.app.report.window?.label || ''"></span>
      <button @click="$store.app.moveReportPeriod(1)" class="btn-icon" :disabled="$store.app.report.range === 'all'">›</button>
    </div>
    <section class="report-total">
      <span>支出合計</span>
      <strong x-text="$store.app.report.totalExpense.toLocaleString()"></strong>
      <small>單位：TWD</small>
    </section>
    <div class="report-chart" x-show="$store.app.report.categories.length">
      <canvas id="category-report-chart"></canvas>
    </div>
    <ul class="category-ranking">
      <template x-if="$store.app.report.categories.length === 0"><li class="empty-state">此期間尚無支出資料</li></template>
      <template x-for="(row, index) in $store.app.report.categories" :key="row.categoryId">
        <li @click="$store.app.openReportDetail(row)">
          <span class="legend-dot" :style="'background:' + ['#2563EB','#16A34A','#EA580C','#7C3AED','#DC2626','#0891B2','#CA8A04','#DB2777'][index % 8]"></span>
          <div><strong x-text="row.categoryName"></strong><small x-text="row.transactionCount + ' 筆交易'"></small></div>
          <div class="ranking-value"><strong x-text="row.amount.toLocaleString()"></strong><small x-text="Math.round(row.percentage * 100) + '%'"></small></div>
          <span class="chevron">›</span>
        </li>
      </template>
    </ul>
  </main>

  <main x-show="$store.app.currentView === 'reportDetail'">
    <div class="detail-heading">
      <h2 x-text="$store.app.report.detailTitle"></h2>
      <span x-text="$store.app.report.window?.label || ''"></span>
    </div>
    <template x-for="group in $store.app.report.detailGroups" :key="group.date">
      <section class="transaction-group">
        <h3 x-text="group.date.replace(/-/g, '/')"></h3>
        <ul class="tx-list">
          <template x-for="tx in group.transactions" :key="tx.Id">
            <li class="tx-row" @click="$store.app.openEdit(tx)">
              <div class="tx-info"><span class="tx-note" x-text="tx.Note || tx.CategoryName"></span></div>
              <div class="tx-right"><span class="tx-amount expense" x-text="'-' + Number(tx.Amount).toLocaleString() + ' ' + tx.Currency"></span></div>
            </li>
          </template>
        </ul>
      </section>
    </template>
  </main>

  <!-- More View -->
  <main x-show="$store.app.currentView === 'more'">
    <div class="menu-grid">
      <button class="menu-card" @click="$store.app.navigate('budgets')"><span>🎯</span><strong>預算</strong><small>每月分類額度</small></button>
      <button class="menu-card" @click="$store.app.navigate('categories')"><span>🏷️</span><strong>分類管理</strong><small>收入與支出分類</small></button>
      <button class="menu-card" @click="$store.app.navigate('trends')"><span>📈</span><strong>資產趨勢</strong><small>資產快照與圖表</small></button>
      <button class="menu-card" @click="$store.app.navigate('settings')"><span>⚙️</span><strong>設定</strong><small>Google Drive 與離線快取</small></button>
    </div>
  </main>

  <!-- Category Management -->
  <main x-show="$store.app.currentView === 'categories'">
    <div class="type-tabs">
      <button @click="$store.app.setCategoryType('expense')" :class="{ active: $store.app.category.type === 'expense' }">支出</button>
      <button @click="$store.app.setCategoryType('income')" :class="{ active: $store.app.category.type === 'income' }">收入</button>
    </div>

    <ul class="card-list">
      <template x-if="$store.app.category.items.length === 0"><li class="empty-state">尚無分類</li></template>
      <template x-for="item in $store.app.category.items" :key="item.Id">
        <li class="list-card" @click="$store.app.openCategoryEdit(item)">
          <span class="tx-icon" x-text="$store.app.iconDisplay(item.Icon)"></span>
          <strong x-text="item.Name"></strong>
          <span class="chevron">›</span>
        </li>
      </template>
    </ul>
    <button class="fab" @click="$store.app.openCategoryAdd()">+</button>
  </main>

  <main x-show="$store.app.currentView === 'categoryForm'">
    <form @submit.prevent="$store.app.saveCategory()" class="tx-form">
      <div class="form-group">
        <label for="category-name">名稱</label>
        <input id="category-name" x-model="$store.app.category.form.name" maxlength="50" autocomplete="off">
        <span class="error" x-text="$store.app.category.errors.name"></span>
      </div>
      <div class="form-group">
        <label for="category-type">類型</label>
        <select id="category-type" x-model="$store.app.category.form.type">
          <option value="expense">支出</option><option value="income">收入</option>
        </select>
        <span class="error" x-text="$store.app.category.errors.type"></span>
      </div>
      <div class="form-group">
        <label for="category-icon">圖示代碼</label>
        <input id="category-icon" x-model="$store.app.category.form.icon" placeholder="cat_other.png">
      </div>
      <button type="submit" class="btn-primary">儲存分類</button>
      <button type="button" x-show="$store.app.category.editTarget" @click="$store.app.deleteManagedCategory()" class="btn-danger">刪除分類</button>
    </form>
  </main>

  <!-- Budgets -->
  <main x-show="$store.app.currentView === 'budgets'">
    <div class="month-nav">
      <button @click="$store.app.moveBudgetMonth(-1)" class="btn-icon" aria-label="Previous month">‹</button>
      <span x-text="$store.app.budget.month"></span>
      <button @click="$store.app.moveBudgetMonth(1)" class="btn-icon" aria-label="Next month">›</button>
    </div>
    <ul class="card-list">
      <template x-if="$store.app.budget.items.length === 0"><li class="empty-state">本月尚未設定預算</li></template>
      <template x-for="item in $store.app.budget.items" :key="item.Id">
        <li class="budget-card" :class="{ over: $store.app.budgetProgress(item).overBudget }" @click="$store.app.openBudgetEdit(item)">
          <div class="budget-row"><strong x-text="item.CategoryName || '未分類'"></strong><span x-text="$store.app.budgetProgress(item).percent + '%'"></span></div>
          <div class="progress-track"><span :style="'width:' + $store.app.budgetProgress(item).barPercent + '%' "></span></div>
          <small x-text="Number(item.SpentAmount).toLocaleString() + ' / ' + Number(item.Amount).toLocaleString()"></small>
        </li>
      </template>
    </ul>
    <button class="fab" @click="$store.app.openBudgetAdd()">+</button>
  </main>

  <main x-show="$store.app.currentView === 'budgetForm'">
    <form @submit.prevent="$store.app.saveBudget()" class="tx-form">
      <div class="form-group">
        <label for="budget-category">支出分類</label>
        <select id="budget-category" x-model="$store.app.budget.form.categoryId" :disabled="$store.app.budget.editTarget">
          <option value="">選擇分類…</option>
          <template x-for="cat in $store.app.categories" :key="cat.Id"><option :value="cat.Id" x-text="cat.Name"></option></template>
        </select>
        <span class="error" x-text="$store.app.budget.errors.categoryId"></span>
      </div>
      <div class="form-group">
        <label for="budget-amount">每月預算</label>
        <input id="budget-amount" type="number" inputmode="decimal" step="0.01" min="0" x-model="$store.app.budget.form.amount">
        <span class="error" x-text="$store.app.budget.errors.amount"></span>
      </div>
      <button type="submit" class="btn-primary">儲存預算</button>
      <button type="button" x-show="$store.app.budget.editTarget" @click="$store.app.deleteBudget()" class="btn-danger">刪除預算</button>
    </form>
  </main>

  <!-- Transaction List View -->
  <main x-show="$store.app.currentView === 'transactions'">
    <!-- Month filter -->
    <div class="month-nav">
      <button @click="$store.app.prevMonth()" class="btn-icon">‹</button>
      <span x-text="$store.app.filter.month"></span>
      <button @click="$store.app.nextMonth()" class="btn-icon">›</button>
    </div>

    <!-- Type tabs -->
    <div class="type-tabs">
      <button @click="$store.app.setTypeFilter('all')"
              :class="{ active: $store.app.filter.type === 'all' }">All</button>
      <button @click="$store.app.setTypeFilter('income')"
              :class="{ active: $store.app.filter.type === 'income' }">Income</button>
      <button @click="$store.app.setTypeFilter('expense')"
              :class="{ active: $store.app.filter.type === 'expense' }">Expense</button>
    </div>

    <div class="filter-grid">
      <select aria-label="Category filter" x-model="$store.app.filter.categoryId"
              @change="$store.app.setTransactionFilter('categoryId', $event.target.value)">
        <option value="">所有分類</option>
        <template x-for="cat in $store.app.filterCategories" :key="cat.Id">
          <option :value="cat.Id" x-text="cat.Name"></option>
        </template>
      </select>
      <select aria-label="Currency filter" x-model="$store.app.filter.currency"
              @change="$store.app.setTransactionFilter('currency', $event.target.value)">
        <option value="all">所有幣別</option>
        <option value="TWD">TWD</option><option value="USD">USD</option><option value="JPY">JPY</option><option value="EUR">EUR</option>
      </select>
    </div>

    <!-- Transaction rows -->
    <ul class="tx-list">
      <template x-if="$store.app.transactions.length === 0">
        <li class="empty-state">No transactions this month</li>
      </template>
      <template x-for="tx in $store.app.transactions" :key="tx.Id">
        <li class="tx-row" @click="$store.app.openEdit(tx)">
          <span class="tx-icon" x-text="$store.app.iconDisplay(tx.CategoryIcon)"></span>
          <div class="tx-info">
            <span class="tx-category" x-text="tx.CategoryName || 'Uncategorized'"></span>
            <span class="tx-note" x-text="tx.Note"></span>
          </div>
          <div class="tx-right">
            <span class="tx-amount"
                  :class="tx.Type === 'income' ? 'income' : 'expense'"
                  x-text="(tx.Type === 'income' ? '+' : '-') + Number(tx.Amount).toLocaleString() + ' ' + tx.Currency">
            </span>
            <span class="tx-date" x-text="tx.Date?.slice(0, 10)"></span>
          </div>
        </li>
      </template>
    </ul>

    <!-- FAB -->
    <button class="fab" @click="$store.app.openAdd()">+</button>
  </main>

  <!-- Add/Edit Form View -->
  <main x-show="$store.app.currentView === 'form'">
    <form @submit.prevent="$store.app.saveTransaction()" class="tx-form">

      <!-- Type -->
      <div class="form-group">
        <label>Type</label>
        <div class="radio-group">
          <label>
            <input type="radio" x-model="$store.app.form.type" value="expense"
                   @change="$store.app.onTypeChange()"> Expense
          </label>
          <label>
            <input type="radio" x-model="$store.app.form.type" value="income"
                   @change="$store.app.onTypeChange()"> Income
          </label>
        </div>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="amount">Amount</label>
        <input id="amount" type="text" inputmode="decimal"
               x-model="$store.app.form.amount" @input="$store.app.onAmountInput($event)"
               @keydown.enter.prevent="$store.app.focusNextTransactionField('amount')" placeholder="0.00">
        <span class="error" x-text="$store.app.errors.amount"></span>
      </div>

      <!-- Currency -->
      <div class="form-group">
        <label for="currency">Currency</label>
        <select id="currency" x-model="$store.app.form.currency">
          <option>TWD</option>
          <option>USD</option>
          <option>JPY</option>
          <option>EUR</option>
        </select>
      </div>

      <!-- Category -->
      <div class="form-group">
        <template x-if="$store.app.frequentCategories.length">
          <div>
            <label>常用分類</label>
            <div class="category-chips">
              <template x-for="cat in $store.app.frequentCategories" :key="cat.Id">
                <button type="button" @click="$store.app.selectFrequentCategory(cat)"
                        :class="{ active: Number($store.app.form.categoryId) === Number(cat.Id) }">
                  <span x-text="$store.app.iconDisplay(cat.Icon)"></span><span x-text="cat.Name"></span>
                </button>
              </template>
            </div>
          </div>
        </template>
        <label for="category">Category</label>
        <select id="category" x-model="$store.app.form.categoryId"
                @change="$store.app.focusNextTransactionField('category')">
          <option value="">Select category…</option>
          <template x-for="cat in $store.app.categories" :key="cat.Id">
            <option :value="cat.Id" x-text="$store.app.iconDisplay(cat.Icon) + ' ' + cat.Name"></option>
          </template>
        </select>
        <span class="error" x-text="$store.app.errors.categoryId"></span>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" type="date" x-model="$store.app.form.date"
               @change="$store.app.focusNextTransactionField('date')">
      </div>

      <!-- Note -->
      <div class="form-group">
        <label for="note">Note</label>
        <input id="note" type="text" x-model="$store.app.form.note" placeholder="Optional">
      </div>

      <!-- Local receipt attachment -->
      <section class="attachment-panel">
        <div class="attachment-heading"><strong>收據圖片</strong><small>僅儲存在此裝置</small></div>
        <template x-if="$store.app.attachment.previewUrl">
          <img class="receipt-preview" :src="$store.app.attachment.previewUrl" alt="Receipt preview"
               @click="$store.app.openReceiptViewer()">
        </template>
        <p class="attachment-unavailable"
           x-show="$store.app.attachment.persistedPath && !$store.app.attachment.available && !$store.app.attachment.stagedPath">
          此交易有收據紀錄，但圖片不在這個裝置上。
        </p>
        <label class="file-button" :class="{ disabled: !$store.app.receiptSupported || $store.app.attachment.busy }">
          <span x-text="$store.app.attachment.previewUrl ? '替換圖片' : '拍照或選擇圖片'"></span>
          <input id="receipt-file" type="file" accept="image/*" capture="environment"
                 :disabled="!$store.app.receiptSupported || $store.app.attachment.busy"
                 @change="$store.app.stageReceipt($event)">
        </label>
        <div class="attachment-actions" x-show="$store.app.attachment.previewUrl">
          <button type="button" class="btn-secondary" @click="$store.app.openReceiptViewer()">查看</button>
          <button type="button" class="btn-ghost" @click="$store.app.removeReceipt()">移除</button>
        </div>
        <small x-show="!$store.app.receiptSupported">此瀏覽器不支援 OPFS，因此無法保存收據圖片。</small>
        <span class="error" x-text="$store.app.attachment.error"></span>
      </section>

      <button type="submit" class="btn-primary">
        <span x-text="$store.app.editTarget ? 'Save Changes' : 'Add Transaction'"></span>
      </button>

      <!-- Delete (edit only) -->
      <button type="button" x-show="$store.app.editTarget"
              @click="$store.app.deleteTransaction()"
              class="btn-danger">Delete</button>
    </form>
  </main>

  <main x-show="$store.app.currentView === 'receiptViewer'" class="receipt-viewer">
    <img :src="$store.app.attachment.previewUrl" alt="Receipt image">
  </main>

  <!-- Settings View -->
  <main x-show="$store.app.currentView === 'settings'">
    <div class="settings-panel">

      <!-- Credentials setup -->
      <div class="form-group">
        <label for="cfg-id">Google Client ID</label>
        <input id="cfg-id" type="text" x-model="$store.app.setup.clientId" placeholder="…apps.googleusercontent.com">
      </div>
      <div class="form-group">
        <label for="cfg-secret">Client Secret</label>
        <input id="cfg-secret" type="password" x-model="$store.app.setup.clientSecret" placeholder="GOCSPX-…">
      </div>
      <button @click="$store.app.saveSetup()" class="btn-secondary">Save Credentials</button>

      <hr style="border:none;border-top:1px solid var(--border)">

      <div class="drive-status">
        <span x-text="
          $store.app.driveStatus === 'connected' ? '🟢 Google Drive connected' :
          $store.app.driveStatus === 'syncing'   ? '🔄 Syncing…' :
                                                   '⚪ Not connected'
        "></span>
      </div>

      <button x-show="$store.app.driveStatus === 'disconnected'"
              @click="$store.app.connectDrive()"
              class="btn-primary">Connect Google Drive</button>

      <button x-show="$store.app.driveStatus !== 'disconnected'"
              @click="$store.app.backupToDrive()"
              :disabled="$store.app.driveStatus === 'syncing'"
              class="btn-primary">Backup to Drive</button>

      <button x-show="$store.app.driveStatus !== 'disconnected'"
              @click="$store.app.restoreFromDrive()"
              :disabled="$store.app.driveStatus === 'syncing'"
              class="btn-secondary">Restore from Drive</button>

      <button x-show="$store.app.driveStatus !== 'disconnected'"
              @click="$store.app.disconnectDrive()"
              class="btn-ghost">Disconnect</button>

      <hr style="border:none;border-top:1px solid var(--border)">

      <button @click="$store.app.resetServiceWorker()"
              class="btn-ghost">Reset Service Worker (force refresh)</button>
    </div>
  </main>

  <!-- Asset Trend View -->
  <main x-show="$store.app.currentView === 'trends'">

    <!-- Latest total -->
    <template x-if="$store.app.snapshots.length > 0">
      <div class="latest-total">
        <div class="latest-total-caption"
             x-text="'最新總資產 (' + $store.app.snapshots[0].Date.replace(/-/g,'/') + ')'"></div>
        <div class="latest-total-amount"
             x-text="(($store.app.snapshots[0].Stock + $store.app.snapshots[0].Cash + $store.app.snapshots[0].FirstTrade + $store.app.snapshots[0].Property)|0).toLocaleString()"></div>
      </div>
    </template>

    <!-- Chart -->
    <div class="chart-container" x-show="$store.app.snapshots.length > 0">
      <canvas id="asset-trend-chart"></canvas>
    </div>

    <!-- Snapshot history -->
    <h3 class="section-title" x-show="$store.app.snapshots.length > 0">快照歷史</h3>

    <ul class="snapshot-list">
      <template x-if="$store.app.snapshots.length === 0">
        <li class="empty-state">尚無資產快照資料</li>
      </template>
      <template x-for="s in $store.app.snapshots" :key="s.Id">
        <li class="snapshot-card" @click="$store.app.openSnapshotEdit(s)">
          <div class="snapshot-date" x-text="s.Date.replace(/-/g,'/')"></div>
          <div class="snapshot-grid">
            <div class="snapshot-cell">
              <span class="snapshot-label">Stock</span>
              <span class="snapshot-value" x-text="(s.Stock|0).toLocaleString()"></span>
            </div>
            <div class="snapshot-cell">
              <span class="snapshot-label">Cash</span>
              <span class="snapshot-value" x-text="(s.Cash|0).toLocaleString()"></span>
            </div>
            <div class="snapshot-cell">
              <span class="snapshot-label">FirstTrade</span>
              <span class="snapshot-value" x-text="(s.FirstTrade|0).toLocaleString()"></span>
            </div>
            <div class="snapshot-cell">
              <span class="snapshot-label">Property(房產)</span>
              <span class="snapshot-value" x-text="(s.Property|0).toLocaleString()"></span>
            </div>
          </div>
        </li>
      </template>
    </ul>

    <!-- FAB -->
    <button class="fab" @click="$store.app.openSnapshotAdd()">+</button>
  </main>

  <!-- Snapshot Form View -->
  <main x-show="$store.app.currentView === 'snapshotForm'">
    <form @submit.prevent="$store.app.saveSnapshot()" class="tx-form">

      <div class="form-group">
        <label for="snap-date">日期</label>
        <input id="snap-date" type="date" x-model="$store.app.snapshotForm.date">
        <span class="error" x-text="$store.app.snapshotErrors.date"></span>
      </div>

      <div class="form-group">
        <label for="snap-stock">Stock</label>
        <input id="snap-stock" type="number" inputmode="numeric" step="1" min="0"
               x-model="$store.app.snapshotForm.stock" placeholder="0">
        <span class="error" x-text="$store.app.snapshotErrors.stock"></span>
      </div>

      <div class="form-group">
        <label for="snap-cash">Cash</label>
        <input id="snap-cash" type="number" inputmode="numeric" step="1" min="0"
               x-model="$store.app.snapshotForm.cash" placeholder="0">
        <span class="error" x-text="$store.app.snapshotErrors.cash"></span>
      </div>

      <div class="form-group">
        <label for="snap-first-trade">FirstTrade</label>
        <input id="snap-first-trade" type="number" inputmode="numeric" step="1" min="0"
               x-model="$store.app.snapshotForm.firstTrade" placeholder="0">
        <span class="error" x-text="$store.app.snapshotErrors.firstTrade"></span>
      </div>

      <div class="form-group">
        <label for="snap-property">Property(房產)</label>
        <input id="snap-property" type="number" inputmode="numeric" step="1" min="0"
               x-model="$store.app.snapshotForm.property" placeholder="0">
        <span class="error" x-text="$store.app.snapshotErrors.property"></span>
      </div>

      <button type="submit" class="btn-primary">
        <span x-text="$store.app.snapshotEditTarget ? '更新快照' : '新增快照'"></span>
      </button>

      <button type="button"
              x-show="$store.app.snapshotEditTarget"
              @click="$store.app.deleteSnapshot()"
              class="btn-danger">刪除</button>
    </form>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar" x-show="$store.app.isPrimaryView()">
    <button :class="{ active: $store.app.currentView === 'home' }" @click="$store.app.navigate('home')"><span class="tab-icon">🏠</span><span class="tab-label">總覽</span></button>
    <button :class="{ active: $store.app.currentView === 'transactions' }" @click="$store.app.navigate('transactions')"><span class="tab-icon">📒</span><span class="tab-label">交易</span></button>
    <button :class="{ active: $store.app.currentView === 'statistics' }" @click="$store.app.navigate('statistics')"><span class="tab-icon">📊</span><span class="tab-label">統計</span></button>
    <button :class="{ active: $store.app.currentView === 'categoryReport' }" @click="$store.app.navigate('categoryReport')"><span class="tab-icon">🍩</span><span class="tab-label">分類</span></button>
    <button :class="{ active: $store.app.currentView === 'more' }" @click="$store.app.navigate('more')"><span class="tab-icon">•••</span><span class="tab-label">更多</span></button>
  </nav>

  <!-- Toast -->
  <div x-show="$store.app.toast.visible"
       x-transition
       class="toast"
       x-text="$store.app.toast.message">
  </div>

  <script src="./vendor/sql-wasm.js"></script>
  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./vendor/alpine.min.js" defer></script>
  <script src="./accounting.js"></script>
  <script src="./app-state.js"></script>
  <script src="./db.js"></script>
  <script src="./receipts.js"></script>
  <script src="./drive.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
